###########################################################################
# SliTaz
###########################################################################
- name: slitaz_x86_64
  type: repository
  desc: SliTaz x86_64
  statsgroup: SliTaz
  family: slitaz
  ruleset: slitaz
  minpackages: 10
  sources:
    - name: packages.info
      fetcher:
        class: FileFetcher
        url: https://mirror.slitaz.org/x86_64/cooking/packages/packages.info
      parser:
        class: SliTazInfoParser
  repolinks:
    - desc: SliTaz home
      url: https://www.slitaz.org/
  packagelinks:
    - type: PACKAGE_HOMEPAGE
      url: 'https://hg.slitaz.org/wok/file/default/{srcname}'
    - type: PACKAGE_RECIPE
      url: 'https://hg.slitaz.org/wok/file/default/{srcname}/receipt'
    - type: PACKAGE_RECIPE_RAW
      url: 'https://hg.slitaz.org/wok/raw-file/default/{srcname}/receipt'
  groups: [ all, production, slitaz ]

