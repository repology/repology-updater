###########################################################################
# StarkOS
###########################################################################
- name: starkos
  type: repository
  desc: StarkOS
  family: starkos
  ruleset: starkos
  minpackages: 2000
  default_maintainer: fallback-mnt-starkos@repology
  sources:
    - name: ports.json
      fetcher:
        class: FileFetcher
        url: 'https://stark-os.codeberg.page/assets/ports.json'
        allow_zero_size: false
      parser:
        class: StarkosJsonParser
  repolinks:
    - desc: StarkOS home
      url: https://stark-os.codeberg.page/
    - desc: StarkOS ports on Codeberg
      url: https://codeberg.org/stark-OS/
  packagelinks:
    - type: PACKAGE_SOURCES
      url: 'https://codeberg.org/stark-OS/{subrepo}/src/branch/main/{srcname}'
    - type: PACKAGE_RECIPE_RAW
      url: 'https://codeberg.org/stark-OS/{subrepo}/raw/branch/main/{srcname}/sbuild'
  groups: [ all, production ]
