###########################################################################
# Mageia
###########################################################################
{% macro mageia(version, valid_till=None) %}
- name: mageia_{{version}}
  type: repository
  desc: Mageia {{version}}
  statsgroup: Mageia
  family: mageia
  ruleset: [mageia, rpm]
  color: '262f45'
  minpackages: 16000
  {% if valid_till %}
  valid_till: {{valid_till}}
  {% endif %}
  pessimized: "does not provide access (HTTP 403) to package pages under https://madb.mageialinux-online.org"
  sources:
    # */backports_testing and */updates_testing not included, are these needed?
    # cauldron noes not seem to have updates and backports subrepos, is this correct?
    {% for sub1 in ['core', 'nonfree', 'tainted'] %}
    {% for sub2 in ['release', 'updates', 'backports'] %}
    - name: {{sub1}}/{{sub2}}
      fetcher:
        class: RepodataFetcher
        url: 'https://mirrors.kernel.org/mageia/distrib/{{version}}/SRPMS/{{sub1}}/{{sub2}}/'
      parser:
        class: RepodataParser
        vertags: mga
      subrepo: {{sub1}}/{{sub2}}
    {% endfor %}
    {% endfor %}
  repolinks:
    - desc: Mageia home
      url: https://www.mageia.org/
    - desc: Mageia App Db
      url: https://madb.mageialinux-online.org/
  packagelinks:
    - type: PACKAGE_HOMEPAGE
      url: 'https://madb.mageialinux-online.org/rpmshow?rpm={srcname|quote}&repo={{version}}-SRPMS-core-release&distribution={{version}}&architecture=x86_64&graphical=0'
    {% if version == 'cauldron' %}
    - type: PACKAGE_RECIPE
      url: 'https://svnweb.mageia.org/packages/cauldron/{srcname}/current/SPECS/{srcname}.spec?view=markup'
    - type: PACKAGE_RECIPE_RAW
      url: 'https://svnweb.mageia.org/packages/cauldron/{srcname}/current/SPECS/{srcname}.spec?view=co'
    {% else %}
    - type: PACKAGE_RECIPE
      url: 'https://svnweb.mageia.org/packages/updates/{{version}}/{srcname}/current/SPECS/{srcname}.spec?view=markup'
    - type: PACKAGE_RECIPE_RAW
      url: 'https://svnweb.mageia.org/packages/updates/{{version}}/{srcname}/current/SPECS/{srcname}.spec?view=co'
    {% endif %}
  groups: [ all, production, mageia, rpm ]
{% endmacro %}

# https://www.mageia.org/en/support/
# https://en.wikipedia.org/wiki/Mageia#Version_history
{{ mageia('9', valid_till='2026-09-28') }}
{{ mageia('10', valid_till='2028-03-31') }}
{{ mageia('cauldron') }}
